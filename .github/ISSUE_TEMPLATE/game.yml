name: Something's wrong in the game
description: A crash, a freeze, a broken map, battle or cutscene, missing sound, anything that plays differently from the PC version.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        One problem per issue, please. Don't attach any of the game's files or anything the builder made.

  - type: dropdown
    id: device
    attributes:
      label: Where are you playing?
      options:
        - PSP-2000
        - PSP-3000
        - PSP Go
        - PSP Street (E1000)
        - PPSSPP
        - PS Vita or PS TV
        - Vita3K
        - 3DS or 2DS
        - Azahar
        - Wii or Wii U
        - Dolphin
        - PS3
        - RPCS3
        - PS2
        - PCSX2 or Play!
        - Xbox 360
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Firmware, loader or emulator version
      placeholder: 6.61 PRO-C2, HENkaku Ensō 3.65, Luma3DS 13.3, Homebrew Channel 1.1.2, Evilnat 4.92, OPL 1.2.0, XeLL Reloaded, PPSSPP 1.18.1...
    validations:
      required: true

  - type: input
    id: port
    attributes:
      label: Port version
      description: The line starting with "v" under V1.0.8 in the top left of the title screen.
    validations:
      required: true

  - type: dropdown
    id: builder
    attributes:
      label: How did you build it?
      options:
        - In the browser (omori.ox80.cc)
        - Desktop builder
        - From source
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: where
    attributes:
      label: Where in the game?
      description: The map, battle, cutscene or menu, and what you were doing right before it.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Can you make it happen again?
      description: The steps, if you know them. A save from right before it helps a lot (the saves folder next to the game, or the OMORI folder on the PS2 memory card).

  - type: textarea
    id: log
    attributes:
      label: Log
      description: Attach log.txt from next to the game (PSP/GAME/OMORI, ux0:data/OMORI, 3ds/omori, apps/omori, /dev_hdd0/game/OMRI00001/USRDIR, omori on the Xbox 360's USB drive), or paste the end of it here. The PS2 build started from its iso doesn't write one.
      render: text

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or video

  - type: checkboxes
    id: copy
    attributes:
      label: Your copy
      options:
        - label: I built it from my own copy of OMORI 1.0.8 bought on Steam.
          required: true
        - label: I'm not attaching any of the game's files or anything the builder made.
          required: true
